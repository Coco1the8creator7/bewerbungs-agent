name: Import Stellen-URLs
on:
  push:
    branches: [main]
    paths: ['importer/url-requests/*.json']
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      urls:
        description: 'Öffentliche Stellen-URLs (Leerzeichen oder Zeilenumbruch, max. 20)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: import-stellenmails
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Import through shared pipeline
        env:
          MANUAL_URLS: ${{ inputs.urls }}
        run: python -m importer.manual_urls
      - name: Commit feed and receipts together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/jobs.json importer/url-results
          if ! git diff --cached --quiet; then
            git commit -m "data: process manual job URL requests"
            git push origin HEAD:main
          fi

  deploy:
    needs: import
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
