name: Auth database bootstrap validation
on:
  pull_request:
    paths:
      - 'ops/production/prepare-auth-database.sh'
      - 'db/migrations/001_auth_foundation.sql'
      - 'db/migrations/002_auth_runtime.sql'
      - '.github/workflows/auth-db-bootstrap-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          bash -n ops/production/prepare-auth-database.sh
          test -s db/migrations/001_auth_foundation.sql
          test -s db/migrations/002_auth_runtime.sql
          ! grep -Eq '(DROP DATABASE|DROP SCHEMA|DROP TABLE)' ops/production/prepare-auth-database.sh
