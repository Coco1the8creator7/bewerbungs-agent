name: Career.Agency - offline checks for server ops

on:
  push:
    branches: [feat/careeragency-controlled-server-ops]
    paths:
      - 'ops/**'
      - '.github/workflows/controlled-server-ops.yml'
      - '.github/workflows/ops-self-checks.yml'
  pull_request:
    paths:
      - 'ops/**'
      - '.github/workflows/controlled-server-ops.yml'
      - '.github/workflows/ops-self-checks.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Check SSH allowlist without server credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and denylist tests
        run: python3 -m unittest discover -s ops/tests -v
      - name: Integration - write a Git snapshot as restricted Linux user
        shell: bash
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash careeragency_runner
          sudo install -d -o careeragency_runner -g careeragency_runner -m 0700 /home/careeragency_runner/careeragency-workspace
          sudo install -d -o careeragency_runner -g careeragency_runner -m 0700 /home/careeragency_runner/careeragency-workspace/releases
          git_sha=b80941a80968880b63db6d2d1ce0be8feebaa720
          sudo install -d -o root -g root -m 0755 /usr/local/lib/careeragency-ops
          sudo install -o root -g root -m 0755 ops/server/stage_commit.sh /usr/local/lib/careeragency-ops/stage_commit.sh
          sudo -u careeragency_runner bash -c 'cd /home/careeragency_runner && /usr/local/lib/careeragency-ops/stage_commit.sh "$1"' bash "$git_sha"
          sudo -u careeragency_runner bash -c 'cd /home/careeragency_runner && /usr/local/lib/careeragency-ops/stage_commit.sh "$1"' bash "$git_sha"
          test -f "/home/careeragency_runner/careeragency-workspace/releases/$git_sha/AGENTS.md"
          test -d "/home/careeragency_runner/careeragency-workspace/releases/$git_sha/dashboard"
          echo "Workspace write integration: success"
      - name: Parse workflow YAML and verify issue trigger
        run: |
          python3 -m pip install --quiet 'PyYAML==6.0.2'
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path('.github/workflows/controlled-server-ops.yml').read_text())
          triggers=data.get('on',data.get(True))
          assert triggers['issues']['types']==['opened']
          assert 'workflow_dispatch' in triggers
          job=data['jobs']['restricted-ssh']
          assert job['environment']=='careeragency-ops'
          assert job['timeout-minutes']==8
          print('Workflow YAML and bounded triggers: valid')
          PY
