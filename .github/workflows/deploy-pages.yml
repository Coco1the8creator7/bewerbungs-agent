name: Webseite veröffentlichen (GitHub Pages)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ false }} # Retired: Infomaniak is the only production host.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prüfe veröffentlichte Dateien
        run: |
          test -f dashboard/index.html
          test ! -e dashboard/data
          test ! -e dashboard/.env
          test ! -e dashboard/credentials.json
          test ! -e dashboard/token.json
      - name: Teste Agency-Level und Ereigniszähler
        run: |
          node --check dashboard/agency-world.js
          node --test tests/agency-world.test.mjs
      - name: Prüfe Filter-KI Synchronisation
        run: |
          node --check dashboard/filter-sync.js
          node --check dashboard/github-sync.js
          node --check dashboard/radar.js
          node --check dashboard/radar-model.js
          node --check dashboard/storage.js
          node --test tests/filter-sync.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
