name: Offline dashboard checks

on:
  push:
    paths:
      - "dashboard/**"
      - "examples/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/dashboard-checks.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - "examples/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/dashboard-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -v
