name: Career.Agency – Infomaniak Legacy Frontend nur prüfen (Veröffentlichung ersetzt)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-frontend
  cancel-in-progress: false

jobs:
  verify:
    name: Frontend prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Veröffentlichungsumfang prüfen
        run: |
          test -f dashboard/index.html
          test ! -e dashboard/data
          test ! -e dashboard/.env
          test ! -e dashboard/.env.local
          test ! -e dashboard/credentials.json
          test ! -e dashboard/token.json
          if find dashboard -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) | grep -q .; then
            echo "::error::Vertrauliche Schlüsseldatei im Dashboard gefunden"
            exit 1
          fi
      - name: JavaScript prüfen
        run: |
          node --check dashboard/agency-world.js
          node --check dashboard/filter-sync.js
          node --check dashboard/github-sync.js
          node --check dashboard/radar.js
          node --check dashboard/radar-model.js
          node --check dashboard/storage.js
      - name: Automatisierte Tests
        run: |
          node --test tests/agency-world.test.mjs tests/filter-sync.test.mjs
