name: Phase 1 multi-user security tests
on:
  push:
    paths:
      - 'dashboard/account*'
      - 'supabase/**'
      - 'tests/multi-user.test.mjs'
      - 'tests/rls_*.sql'
      - '.github/workflows/multiuser-tests.yml'
  pull_request:
    paths:
      - 'dashboard/account*'
      - 'supabase/**'
      - 'tests/multi-user.test.mjs'
      - 'tests/rls_*.sql'
      - '.github/workflows/multiuser-tests.yml'
permissions:
  contents: read
jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and isolated-account contract
        run: |
          node --check dashboard/account.js
          node --check dashboard/account-core.mjs
          node --test tests/multi-user.test.mjs
  test-postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: career_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: career_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Two-account RLS integration tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/rls_harness.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261024000100_career_multiuser.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/rls_isolation.sql
