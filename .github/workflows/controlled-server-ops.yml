name: Career.Agency - controlled SSH server operations

# ChatGPT can create an exact-title issue via the connected GitHub account.
# Public issue content is NEVER interpreted as executable shell code.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      operation:
        description: "Allowlisted server operation (stage writes a code workspace)"
        required: true
        type: choice
        options:
          - status
          - tests
          - feed-audit
          - crawler-probe
          - release-check
          - publish-lehrstellen
          - stage
      commit_sha:
        description: "Required for stage: immutable 40-character Git commit SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: careeragency-controlled-server-ops
  cancel-in-progress: false

jobs:
  restricted-ssh:
    if: >-
      github.repository == 'Coco1the8creator7/bewerbungs-agent' &&
      (
        (
          github.event_name == 'issues' &&
          github.event.issue.user.id == 343900642 &&
          (
            github.event.issue.title == 'CA-OPS: status' ||
            github.event.issue.title == 'CA-OPS: tests' ||
            github.event.issue.title == 'CA-OPS: feed-audit' ||
            github.event.issue.title == 'CA-OPS: crawler-probe' ||
            github.event.issue.title == 'CA-OPS: release-check' ||
            github.event.issue.title == 'CA-OPS: publish-lehrstellen' ||
            startsWith(github.event.issue.title, 'CA-OPS: stage ')
          )
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'Coco1the8creator7' &&
          (
            inputs.operation == 'status' ||
            inputs.operation == 'tests' ||
            inputs.operation == 'feed-audit' ||
            inputs.operation == 'crawler-probe' ||
            inputs.operation == 'release-check' ||
            inputs.operation == 'publish-lehrstellen' ||
            inputs.operation == 'stage'
          )
        )
      )
    name: Execute restricted operation over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: careeragency-ops
    env:
      CA_OPS_HOST: ${{ secrets.CA_OPS_HOST }}
      CA_OPS_KNOWN_HOSTS: ${{ secrets.CA_OPS_KNOWN_HOSTS }}
      CA_OPS_SSH_PRIVATE_KEY: ${{ secrets.CA_OPS_SSH_PRIVATE_KEY }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      MANUAL_OPERATION: ${{ inputs.operation }}
      MANUAL_SHA: ${{ inputs.commit_sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Validate operation and configured credentials
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issues" ]]; then
            case "$ISSUE_TITLE" in
              'CA-OPS: status') operation='status' ;;
              'CA-OPS: tests') operation='tests' ;;
              'CA-OPS: feed-audit') operation='feed-audit' ;;
              'CA-OPS: crawler-probe') operation='crawler-probe' ;;
              'CA-OPS: release-check') operation='release-check' ;;
              'CA-OPS: publish-lehrstellen') operation='publish-lehrstellen' ;;
              'CA-OPS: stage '*) operation='stage'; target_sha="${ISSUE_TITLE#CA-OPS: stage }" ;;
              *) echo "::error::Issue title is not an allowlisted server operation"; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_OPERATION" in
              status|tests|feed-audit|crawler-probe|release-check|publish-lehrstellen) operation="$MANUAL_OPERATION" ;;
              stage) operation="stage"; target_sha="$MANUAL_SHA" ;;
              *) echo "::error::Not an allowlisted operation"; exit 1 ;;
            esac
          else
            exit 1
          fi
          for key in CA_OPS_HOST CA_OPS_KNOWN_HOSTS CA_OPS_SSH_PRIVATE_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub environment secret: $key"
              exit 1
            fi
          done
          if [[ ! "$CA_OPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::Invalid server hostname"
            exit 1
          fi
          if [[ "$operation" == "stage" ]]; then
            if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Staging requires an immutable 40-character lowercase Git commit SHA"
              exit 1
            fi
            printf 'remote_command=stage %s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          else
            printf 'remote_command=%s\n' "$operation" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned SSH credentials in temporary files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$CA_OPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/careeragency_ops_key"
          printf '%s\n' "$CA_OPS_KNOWN_HOSTS" > "$RUNNER_TEMP/careeragency_ops_hosts"
          chmod 600 "$RUNNER_TEMP/careeragency_ops_key" "$RUNNER_TEMP/careeragency_ops_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/careeragency_ops_key" >/dev/null
          ssh-keygen -F "$CA_OPS_HOST" -f "$RUNNER_TEMP/careeragency_ops_hosts" >/dev/null || {
            echo "::error::No pinned SSH host key for configured host"
            exit 1
          }

      - name: Run operation through forced-command SSH key
        shell: bash
        env:
          REMOTE_COMMAND: ${{ steps.select.outputs.remote_command }}
        run: |
          set -euo pipefail
          ssh -T \
            -i "$RUNNER_TEMP/careeragency_ops_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/careeragency_ops_hosts" \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            "careeragency_runner@$CA_OPS_HOST" \
            "$REMOTE_COMMAND"
