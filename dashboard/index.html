<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career.Agency – Deine Lehrstellensuche</title>
  <link rel="stylesheet" href="/urban-mono-magenta.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box }
    body { margin: 0; font-family: Onest, system-ui, sans-serif; color: var(--ca-ink); background: var(--ca-bg) }
    header, main { width: min(68rem, 100%); margin-inline: auto; padding: 1.5rem }
    header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--ca-line) }
    header strong { font-size: 1.35rem }
    main { padding-block: clamp(3rem, 12vh, 9rem) }
    h1 { max-width: 14ch; font-size: clamp(2.6rem, 7vw, 5rem); line-height: 1.04; letter-spacing: -.045em; margin: 0 }
    p { max-width: 45ch; line-height: 1.6; margin: 1.25rem 0 2rem }
    a { display: inline-block; padding: .8rem 1rem; color: var(--ca-accent); font-weight: 600 }
    a.primary { color: white; background: var(--ca-accent); border-radius: .6rem; text-decoration: none }
  </style>
</head>
<body>
  <header><strong>Career.Agency</strong><a href="/account/login">Anmelden</a></header>
  <main>
    <h1>Finde deine Lehrstelle.</h1>
    <p>Entdecke Lehrstellen, merke dir deine Favoriten und behalte deine Bewerbungen im Blick.</p>
    <a class="primary" href="/account/register">Kostenlos registrieren</a>
  </main>
</body>
</html>
