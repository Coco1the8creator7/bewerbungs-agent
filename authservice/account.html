<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Konto · Career.Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ca-bg:#F5F6F7;--ca-paper:#fff;--ca-ink:#262A31;--ca-muted:#636B76;--ca-line:#E1E5E9;--ca-accent:#95516E;font-family:Onest,system-ui,sans-serif;color:var(--ca-ink);background:var(--ca-bg)}
*{box-sizing:border-box}body{margin:0}main{max-width:460px;margin:8vh auto;padding:0 18px}header{margin-bottom:30px}header a{font-weight:700;color:var(--ca-accent);text-decoration:none;letter-spacing:-.02em}section{background:var(--ca-paper);padding:28px;border:1px solid var(--ca-line);border-radius:15px}h1{font-size:1.6rem;margin:0 0 10px;letter-spacing:-.035em}p{line-height:1.55;color:var(--ca-muted)}label{display:block;font-weight:600;font-size:.86rem;margin:16px 0 6px}input{width:100%;background:#fff;padding:12px;border:1px solid #c7cdd4;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:12px 15px;border:0;border-radius:9px;background:var(--ca-accent);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--ca-accent)}nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;font-size:.88rem}#result{min-height:23px;font-size:.9rem}#result.error{color:#A34454}#result.ok{color:#227A5E}.hidden{display:none}.codes{overflow-wrap:anywhere;white-space:pre-wrap;background:#f5f6f7;padding:12px;border-radius:8px}small{color:var(--ca-muted)}.user{padding:12px 0;border-top:1px solid var(--ca-line)}
</style></head>
<body><main><header><a href="/">Career.Agency</a></header><section>
<h1 id="title">Dein Konto</h1><p id="info"></p><div id="content"></div><p id="result" aria-live="polite"></p>
<nav><a href="/account/login">Anmelden</a><a href="/account/register">Registrieren</a></nav>
</section></main><script>
const mode=location.pathname.split('/').pop(),title=document.querySelector('#title'),info=document.querySelector('#info'),
host=document.querySelector('#content'),result=document.querySelector('#result');
function message(text,fail=false){result.className=fail?'error':'ok';result.textContent=text}
async function api(path,data,method='POST'){const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(method==='POST'?{body:JSON.stringify(data)}:{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Anfrage fehlgeschlagen');return j}
function form(fields,label,handler){const f=document.createElement('form');fields.forEach(([id,text,type,required])=>{const l=document.createElement('label');l.htmlFor=id;l.textContent=text;f.append(l);const i=document.createElement('input');i.id=id;i.name=id;i.type=type;i.required=required;i.autocomplete= id==='password'?'current-password':'on';f.append(i)});const b=document.createElement('button');b.textContent=label;f.append(b);host.append(f);f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;message('');try{const o=Object.fromEntries(new FormData(f));await handler(o)}catch(err){message(err.message,true)}finally{b.disabled=false}})}
function route(next){location.href=next==='app'?'/app/':next==='pending'?'/account/waiting':next==='mfa_required'||next==='admin_2fa_setup'?'/account/mfa':'/account/login'}
if(mode==='register'){title.textContent='Konto erstellen';info.textContent='Registriere dich kostenlos. Nach der E-Mail-Bestätigung wird dein Konto freigeschaltet.';form([['first_name','Vorname','text',true],['last_name','Nachname','text',true],['email','E-Mail-Adresse','email',true],['password','Passwort (mindestens 12 Zeichen)','password',true],['residence','Wohnort','text',true],['birth_date','Geburtsdatum','date',false]],'Registrieren',async o=>{if(!o.birth_date)delete o.birth_date;await api('/api/auth/register',o);message('Prüfe dein E-Mail-Postfach.')})}
else if(mode==='login'){title.textContent='Anmelden';info.textContent='Willkommen zurück.';form([['email','E-Mail-Adresse','email',true],['password','Passwort','password',true]],'Anmelden',async o=>{o.remember=document.querySelector('#remember').checked;const r=await api('/api/auth/login',o);route(r.next)});const l=document.createElement('label');l.innerHTML='<input style="width:auto" type="checkbox" id="remember"> Angemeldet bleiben (45 Tage)';host.firstChild.insertBefore(l,host.firstChild.lastChild);const a=document.createElement('a');a.href='/account/reset';a.textContent='Passwort vergessen?';host.append(a)}
else if(mode==='waiting'){title.textContent='Dein Konto wartet auf Freischaltung.';info.textContent='Nach der E-Mail-Bestätigung schaltet die Administration deinen Zugang frei.';form([['email','Bestätigungs-E-Mail erneut senden','email',true]],'Neuen Bestätigungslink senden',async o=>{const j=await api('/api/auth/verify-email/resend',o);message(j.message)})}
else if(mode==='verify'){title.textContent='E-Mail bestätigen';const t=new URLSearchParams(location.search).get('token');if(t)api('/api/auth/verify-email',{token:t}).then(j=>message(j.message)).catch(e=>message(e.message,true));else message('Der Link ist unvollständig.',true)}
else if(mode==='reset'){title.textContent='Passwort zurücksetzen';const t=new URLSearchParams(location.search).get('token');if(t)form([['password','Neues Passwort (mindestens 12 Zeichen)','password',true]],'Passwort ändern',async o=>{const j=await api('/api/auth/password-reset/confirm',{token:t,password:o.password});message(j.message)});else form([['email','E-Mail-Adresse','email',true]],'Reset-Link senden',async o=>{const j=await api('/api/auth/password-reset/request',o);message(j.message)})}
else if(mode==='mfa'){title.textContent='Zwei-Faktor-Authentifizierung';info.textContent='Nutze eine Authenticator-App. Falls du noch keinen Code eingerichtet hast, wähle „Einrichten“.';const setup=document.createElement('button');setup.textContent='Authenticator einrichten';host.append(setup);setup.onclick=async()=>{try{const j=await api('/api/auth/totp/setup',{});message('Schlüssel in der Authenticator-App eingeben: '+j.secret)}catch(e){message(e.message,true)}};form([['code','6-stelliger Code','text',true]],'Code bestätigen',async o=>{try{const j=await api('/api/auth/totp/verify',o);route(j.next)}catch(e){const j=await api('/api/auth/totp/confirm',o);if(j.recovery_codes){const p=document.createElement('pre');p.className='codes';p.textContent=j.recovery_codes.join('\n');host.append(p);message('Notfallcodes sicher speichern. Du bist nun mit 2FA angemeldet.');const b=document.createElement('button');b.textContent='Weiter';b.onclick=async()=>{const x=await api('/api/auth/me',null,'GET');location.href=x.role==='admin'?'/admin':'/app/'};host.append(b)}else route(j.next)}})}
else if(mode==='admin'){title.textContent='Benutzerverwaltung';info.textContent='Nur für Administratoren.';api('/api/admin/users',null,'GET').then(({users})=>{users.forEach(u=>{const d=document.createElement('div');d.className='user';const p=document.createElement('p');p.textContent=u.first_name+' '+u.last_name+' · '+u.email+' · '+u.status;d.append(p);for(const [label,act] of [['Freischalten','activate'],['Sperren','block'],['Entsperren','unblock']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('/api/admin/users/'+u.id+'/'+act,{});message('Aktion durchgeführt');location.reload()}catch(e){message(e.message,true)}};d.append(b)}host.append(d)})}).catch(e=>message(e.message,true))}
else{message('Seite nicht gefunden',true)}
</script></body></html>
