<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Konto · Career.Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ca-bg: #f5f6f7;
        --ca-paper: #fff;
        --ca-ink: #262a31;
        --ca-muted: #636b76;
        --ca-line: #e1e5e9;
        --ca-accent: #95516e;
        --ca-soft: #f7eef2;
        --ca-danger: #a34454;
        font-family: Onest, system-ui, sans-serif;
        color: var(--ca-ink);
        background: var(--ca-bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 460px;
        margin: 6vh auto;
        padding: 0 18px 28px;
      }
      header {
        margin-bottom: 24px;
      }
      header a {
        font-weight: 700;
        color: var(--ca-accent);
        text-decoration: none;
        letter-spacing: -0.02em;
        font-size: 1.2rem;
      }
      section {
        background: var(--ca-paper);
        padding: 28px;
        border: 1px solid var(--ca-line);
        border-radius: 20px;
      }
      h1 {
        font-size: 1.9rem;
        line-height: 1.15;
        margin: 0 0 12px;
        letter-spacing: -0.04em;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.55;
        color: var(--ca-muted);
      }
      label {
        display: block;
        font-weight: 500;
        font-size: 0.86rem;
        margin: 18px 0 7px;
      }
      input {
        width: 100%;
        min-width: 0;
        min-height: 48px;
        background: #fff;
        padding: 12px;
        border: 1px solid #bfc6cf;
        border-radius: 10px;
        font: inherit;
        font-size: 16px;
        color: var(--ca-ink);
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 22px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--ca-accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      a {
        color: var(--ca-accent);
        text-underline-offset: 3px;
      }
      nav {
        border-top: 1px solid var(--ca-line);
        margin-top: 20px;
        padding-top: 12px;
        text-align: center;
        font-size: 0.85rem;
      }
      nav a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
      }
      #result {
        font-size: 0.86rem;
        overflow-wrap: anywhere;
        margin: 0;
      }
      #result:not(:empty) {
        margin-top: 18px;
        padding: 12px;
        background: var(--ca-bg);
        border-radius: 8px;
      }
      #result.error {
        border-left: 3px solid var(--ca-danger);
        color: var(--ca-ink);
      }
      #result.ok {
        color: #227a5e;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .codes {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        background: var(--ca-bg);
        padding: 12px;
        border-radius: 8px;
      }
      small,
      .help {
        font-size: 0.78rem;
        line-height: 1.5;
        color: var(--ca-muted);
      }
      .help {
        margin: 7px 0 0;
      }
      .user {
        padding: 12px 0;
        border-top: 1px solid var(--ca-line);
      }
      .password {
        position: relative;
      }
      .password input {
        padding-right: 84px;
      }
      .password button {
        position: absolute;
        right: 2px;
        top: 2px;
        width: auto;
        min-height: 44px;
        margin: 0;
        background: transparent;
        color: var(--ca-accent);
        font-size: 0.76rem;
        padding: 10px;
      }
      .text-action {
        display: inline-flex;
        align-items: center;
        width: auto;
        min-height: 44px;
        margin: 0;
        background: transparent;
        color: var(--ca-accent);
        padding: 8px 0;
        font-size: 0.85rem;
        font-weight: 400;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .secondary {
        background: var(--ca-paper);
        color: var(--ca-ink);
        border: 1px solid var(--ca-line);
        margin-top: 12px;
      }
      .notice {
        padding: 14px;
        background: var(--ca-soft);
        border-radius: 10px;
        font-size: 0.82rem;
        line-height: 1.5;
        margin-top: 20px;
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-weight: 400;
        line-height: 1.45;
      }
      .check input {
        width: 20px;
        min-height: 20px;
        height: 20px;
        flex-shrink: 0;
        accent-color: var(--ca-accent);
        margin: 0;
      }
      .check small {
        display: block;
        margin-top: 3px;
      }
      .field-error {
        margin-top: 6px;
        color: var(--ca-danger);
        font-size: 0.8rem;
        line-height: 1.4;
      }
      input[aria-invalid="true"] {
        border-color: var(--ca-danger);
      }
      .email {
        display: block;
        overflow-wrap: anywhere;
        color: var(--ca-ink);
        font-weight: 500;
        margin-top: 10px;
      }
      .timeline {
        list-style: none;
        margin: 25px 0;
        padding: 0;
      }
      .timeline li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        font-size: 0.9rem;
        margin-bottom: 22px;
      }
      .timeline small {
        display: block;
        margin-top: 4px;
      }
      .dot {
        border-radius: 50%;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: var(--ca-soft);
        color: var(--ca-accent);
      }
      .done {
        background: var(--ca-bg);
        color: #227a5e;
      }
      :focus-visible {
        outline: 3px solid var(--ca-accent);
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        main {
          margin: 24px auto;
          padding: 0 14px 24px;
        }
        section {
          padding: 24px 20px;
        }
        h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header><a href="/">Career.Agency</a></header>
      <section>
        <h1 id="title">Dein Konto</h1>
        <p id="info"></p>
        <div id="content"></div>
        <p id="result" role="status" aria-live="polite"></p>
        <nav id="accountNav"></nav>
      </section>
    </main>
    <script>
      "use strict";
      const mode = location.pathname.split("/").pop(),
        title = document.querySelector("#title"),
        info = document.querySelector("#info"),
        host = document.querySelector("#content"),
        result = document.querySelector("#result"),
        nav = document.querySelector("#accountNav");
      let resendTimer;
      function node(tag, text, className) {
        const n = document.createElement(tag);
        if (text) n.textContent = text;
        if (className) n.className = className;
        return n;
      }
      function message(text, fail = false) {
        result.className = fail ? "error" : "ok";
        result.setAttribute("role", fail ? "alert" : "status");
        result.textContent = text;
      }
      function screen(heading, description = "") {
        clearInterval(resendTimer);
        title.textContent = heading;
        info.textContent = description;
        host.replaceChildren();
        message("");
        document.title = heading + " · Career.Agency";
      }
      function navigation(register = false) {
        nav.replaceChildren(
          node("span", register ? "Schon dabei? " : "Neu hier? "),
        );
        const a = node("a", register ? "Anmelden" : "Konto erstellen");
        a.href = register ? "/account/login" : "/account/register";
        nav.append(a);
      }
      function action(text, handler, secondary = false) {
        const b = node("button", text, secondary ? "secondary" : "");
        b.type = "button";
        b.addEventListener("click", handler);
        host.append(b);
        return b;
      }
      function link(text, path) {
        const a = node("a", text, "text-action");
        a.href = path;
        host.append(a);
        return a;
      }
      function notice(text) {
        host.append(node("div", text, "notice"));
      }
      async function api(path, data, method = "POST") {
        let r;
        try {
          r = await fetch(path, {
            method,
            credentials: "same-origin",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            ...(method === "POST" ? { body: JSON.stringify(data) } : {}),
          });
        } catch {
          throw Error(
            "Keine Verbindung. Prüfe dein Internet und versuche es erneut.",
          );
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          const text =
            r.status === 429
              ? "Zu viele Versuche. Bitte warte etwas und versuche es später erneut."
              : r.status >= 500
                ? "Das hat gerade nicht geklappt. Bitte versuche es später erneut."
                : typeof j.detail === "string"
                  ? j.detail
                  : "Bitte prüfe deine Angaben.";
          const error = Error(text);
          error.status = r.status;
          error.fields = j.fields || {};
          throw error;
        }
        return j;
      }
      function fieldError(input, text) {
        input.setAttribute("aria-invalid", "true");
        document.getElementById(input.id + "-error").textContent = text;
      }
      function clearErrors(f) {
        f.querySelectorAll("input").forEach((i) =>
          i.removeAttribute("aria-invalid"),
        );
        f.querySelectorAll(".field-error").forEach((n) => (n.textContent = ""));
      }
      function form(fields, label, handler) {
        const f = document.createElement("form");
        f.noValidate = true;
        fields.forEach(([id, text, type, required]) => {
          const l = node("label", text);
          l.htmlFor = id;
          f.append(l);
          const i = document.createElement("input");
          i.id = id;
          i.name = id;
          i.type = type;
          i.required = required;
          const autocomplete = {
            first_name: "given-name",
            last_name: "family-name",
            email: "username",
            residence: "address-level2",
            birth_date: "bday",
            code: "one-time-code",
          };
          i.autocomplete =
            id === "password"
              ? mode === "register" || mode === "reset"
                ? "new-password"
                : "current-password"
              : autocomplete[id] || "off";
          if (id === "email") {
            i.autocapitalize = "none";
            i.spellcheck = false;
            i.maxLength = 320;
          }
          if (id === "first_name") {
            i.maxLength = 120;
            i.placeholder = "Vorname";
          }
          if (id === "password") {
            i.maxLength = 1024;
            if (mode === "register" || mode === "reset") i.minLength = 12;
            const wrap = node("div", "", "password");
            wrap.append(i);
            const show = node("button", "Anzeigen");
            show.type = "button";
            show.setAttribute("aria-label", "Passwort anzeigen");
            show.setAttribute("aria-pressed", "false");
            show.onclick = () => {
              const visible = i.type === "password";
              i.type = visible ? "text" : "password";
              show.textContent = visible ? "Verbergen" : "Anzeigen";
              show.setAttribute(
                "aria-label",
                visible ? "Passwort verbergen" : "Passwort anzeigen",
              );
              show.setAttribute("aria-pressed", String(visible));
            };
            wrap.append(show);
            f.append(wrap);
          } else f.append(i);
          if (id === "code" && mode === "mfa") {
            i.inputMode = "numeric";
            i.maxLength = 6;
            i.pattern = "[0-9]{6}";
          }
          const err = node("div", "", "field-error");
          err.id = id + "-error";
          i.setAttribute("aria-describedby", err.id);
          f.append(err);
          if (id === "password" && i.minLength === 12) {
            const help = node(
              "p",
              "Mindestens 12 Zeichen. Ein kurzer Satz geht auch.",
              "help",
            );
            help.id = "password-help";
            i.setAttribute("aria-describedby", err.id + " password-help");
            f.append(help);
          }
          i.addEventListener("input", () => {
            i.removeAttribute("aria-invalid");
            err.textContent = "";
          });
        });
        const b = node("button", label);
        b.type = "submit";
        f.append(b);
        host.append(f);
        f.addEventListener("submit", async (e) => {
          e.preventDefault();
          clearErrors(f);
          message("");
          let first;
          f.querySelectorAll("input").forEach((i) => {
            let error = "";
            if (i.required && !i.value.trim())
              error = "Bitte fülle dieses Feld aus.";
            else if (i.type === "email" && !i.validity.valid)
              error = "Bitte gib eine gültige E-Mail-Adresse ein.";
            else if (
              i.id === "password" &&
              i.minLength === 12 &&
              i.value.length < 12
            )
              error = "Dein Passwort braucht mindestens 12 Zeichen.";
            else if (!i.validity.valid) error = "Bitte prüfe deine Eingabe.";
            if (error) {
              fieldError(i, error);
              first = first || i;
            }
          });
          if (first) {
            first.focus();
            return;
          }
          b.disabled = true;
          b.textContent = "Einen Moment …";
          f.setAttribute("aria-busy", "true");
          try {
            await handler(Object.fromEntries(new FormData(f)));
          } catch (err) {
            Object.entries(err.fields || {}).forEach(([id, text]) => {
              const input = f.querySelector(
                'input[name="' + id.replace(/[^a-z_]/g, "") + '"]',
              );
              if (input && typeof text === "string") {
                fieldError(input, text);
                first = first || input;
              }
            });
            message(err.message, true);
            if (first) first.focus();
          } finally {
            b.disabled = false;
            b.textContent = label;
            f.removeAttribute("aria-busy");
          }
        });
        return f;
      }
      function route(next) {
        location.href =
          next === "app"
            ? "/app/"
            : next === "pending" || next === "waiting"
              ? "/account/waiting"
              : next === "mfa_required" || next === "admin_2fa_setup"
                ? "/account/mfa"
                : "/account/login";
      }
      function resendButton(email) {
        const b = action("Bestätigungslink erneut anfordern", async () => {
          b.disabled = true;
          try {
            const j = await api("/api/auth/verify-email/resend", { email });
            message(j.message);
            let seconds = 60;
            b.textContent = "Erneut anfordern in " + seconds + " s";
            resendTimer = setInterval(() => {
              seconds--;
              b.textContent = seconds
                ? "Erneut anfordern in " + seconds + " s"
                : "Bestätigungslink erneut anfordern";
              if (!seconds) {
                clearInterval(resendTimer);
                b.disabled = false;
              }
            }, 1000);
          } catch (e) {
            message(e.message, true);
            b.disabled = false;
          }
        });
        return b;
      }
      function emailScreen(email) {
        screen(
          "Schau kurz in dein Postfach.",
          "Prüfe, ob unsere Bestätigungs-E-Mail angekommen ist.",
        );
        if (email) info.append(node("span", email, "email"));
        notice(
          "Öffne den Link in der E-Mail, um deine Adresse zu bestätigen. Danach folgt die persönliche Freischaltung.",
        );
        resendButton(email);
        action(
          "E-Mail-Adresse korrigieren",
          () => {
            registration();
            document.getElementById("email").value = email;
            document.getElementById("email").focus();
            message(
              "Prüfe die Adresse und sende das Formular mit der richtigen Adresse erneut. Dein Passwort wird dafür nochmals benötigt.",
            );
          },
          true,
        );
        host.append(
          node(
            "p",
            "Keine E-Mail? Schau auch im Spamordner nach. Falls du bereits ein Konto hast, melde dich an.",
            "help",
          ),
        );
        navigation(true);
      }
      function registration() {
        screen(
          "Deine Lehrstelle. Dein nächster Schritt.",
          "Speichere passende Lehrstellen und behalte deine Bewerbungen im Blick.",
        );
        const f = form(
          [
            ["first_name", "Wie heisst du?", "text", true],
            ["email", "Deine E-Mail-Adresse", "email", true],
            ["password", "Dein Passwort", "password", true],
          ],
          "Kostenloses Konto erstellen",
          async (o) => {
            await api("/api/auth/register", o);
            emailScreen(o.email);
          },
        );
        f.insertBefore(
          node(
            "div",
            "Du bestätigst deine E-Mail. Danach schalten wir dein Konto persönlich frei und informieren dich per E-Mail.",
            "notice",
          ),
          f.lastChild,
        );
        navigation(true);
      }
      function pendingScreen(email = "", authenticated = false) {
        screen(
          "E-Mail bestätigt. Fast geschafft.",
          "Wir prüfen deine Registrierung und schalten dein Konto persönlich frei.",
        );
        const list = node("ol", "", "timeline");
        [
          ["✓", "Konto erstellt", "Deine Angaben sind angekommen."],
          ["✓", "E-Mail bestätigt", email],
          [
            "…",
            "Freischaltung ausstehend",
            "Du erhältst eine E-Mail, sobald du starten kannst.",
          ],
        ].forEach(([mark, heading, detail]) => {
          const li = node("li");
          li.append(node("span", mark, "dot" + (mark === "✓" ? " done" : "")));
          const text = node("div", heading);
          if (detail) text.append(node("small", detail));
          li.append(text);
          list.append(li);
        });
        host.append(list);
        notice(
          "Du kannst diese Seite schliessen. Du musst dich nicht nochmals registrieren.",
        );
        action("Status aktualisieren", async (e) => {
          if (!authenticated) {
            location.href = "/account/login";
            return;
          }
          const b = e.currentTarget;
          b.disabled = true;
          try {
            const u = await api("/api/auth/me", null, "GET");
            if (u.next !== "waiting") route(u.next);
            else
              message(
                "Die Freischaltung ist noch ausstehend. Du erhältst eine E-Mail, sobald du starten kannst.",
              );
          } catch (err) {
            message(
              err.status === 401
                ? "Deine Sitzung ist abgelaufen. Melde dich erneut an, um deinen Status zu prüfen."
                : err.message,
              true,
            );
          } finally {
            b.disabled = false;
          }
        });
        link("Zur Anmeldung", "/account/login");
        nav.replaceChildren();
      }
      async function waiting() {
        screen("Dein Kontostatus", "Dein Status wird geladen …");
        try {
          const u = await api("/api/auth/me", null, "GET");
          if (u.next !== "waiting") {
            route(u.next);
            return;
          }
          if (u.email_verified) pendingScreen(u.email, true);
          else {
            screen(
              "Bestätige deine E-Mail.",
              "Öffne den Bestätigungslink in deinem Postfach. Danach folgt die persönliche Freischaltung.",
            );
            info.append(node("span", u.email, "email"));
            resendButton(u.email);
            link("Zur Anmeldung", "/account/login");
            nav.replaceChildren();
          }
        } catch (e) {
          screen(
            "Prüfe deinen Kontostatus.",
            "Melde dich an, um zu sehen, ob deine E-Mail bestätigt und dein Konto freigeschaltet ist.",
          );
          link("Zur Anmeldung", "/account/login");
          if (e.status !== 401) message(e.message, true);
          navigation(false);
        }
      }
      function verificationRequest() {
        screen(
          "Neuen Bestätigungslink anfordern",
          "Gib die E-Mail-Adresse deiner Registrierung ein.",
        );
        form(
          [["email", "E-Mail-Adresse", "email", true]],
          "Link anfordern",
          async (o) => {
            const j = await api("/api/auth/verify-email/resend", o);
            screen("Prüfe dein E-Mail-Postfach.", j.message);
            info.append(node("span", o.email, "email"));
            notice("Nutze den neuesten Link. Er ist 24 Stunden gültig.");
            link("Zur Anmeldung", "/account/login");
          },
        );
        navigation(true);
      }
      if (mode === "register") registration();
      else if (mode === "login") {
        screen(
          "Schön, dass du wieder da bist.",
          "Weiter zu deinen Lehrstellen und Bewerbungen.",
        );
        const f = form(
          [
            ["email", "E-Mail-Adresse", "email", true],
            ["password", "Passwort", "password", true],
          ],
          "Anmelden",
          async (o) => {
            o.remember = document.querySelector("#remember").checked;
            try {
              const r = await api("/api/auth/login", o);
              route(r.next);
            } catch (e) {
              if (e.status === 401)
                e.message =
                  "E-Mail oder Passwort stimmt nicht. Prüfe deine Eingaben oder setze dein Passwort zurück.";
              throw e;
            }
          },
        );
        const forgot = node("a", "Passwort vergessen?", "text-action");
        forgot.href = "/account/reset";
        f.insertBefore(forgot, f.lastChild);
        const l = node("label", "", "check");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = "remember";
        const words = node("span", "Auf diesem Gerät angemeldet bleiben");
        words.append(node("small", "45 Tage. Nur auf deinem eigenen Gerät."));
        l.append(checkbox, words);
        f.insertBefore(l, f.lastChild);
        navigation(false);
      } else if (mode === "waiting") waiting();
      else if (mode === "verify") {
        screen("E-Mail bestätigen", "Dein Bestätigungslink wird geprüft …");
        navigation(true);
        const token = new URLSearchParams(location.search).get("token");
        history.replaceState(null, "", location.pathname);
        if (token)
          api("/api/auth/verify-email", { token })
            .then(() => pendingScreen())
            .catch((e) => {
              screen(
                "Der Link funktioniert nicht.",
                "Der Link ist möglicherweise abgelaufen oder wurde bereits verwendet.",
              );
              action("Neuen Bestätigungslink anfordern", verificationRequest);
              link("Schon bestätigt? Zur Anmeldung", "/account/login");
              if (e.status >= 500 || !e.status) message(e.message, true);
            });
        else {
          screen(
            "Der Link ist unvollständig.",
            "Fordere einen neuen Bestätigungslink an oder öffne den vollständigen Link aus deiner E-Mail.",
          );
          action("Neuen Bestätigungslink anfordern", verificationRequest);
          link("Zur Anmeldung", "/account/login");
        }
      } else if (mode === "reset") {
        navigation(true);
        const token = new URLSearchParams(location.search).get("token");
        history.replaceState(null, "", location.pathname);
        if (token) {
          screen("Wähle ein neues Passwort.");
          form(
            [["password", "Neues Passwort", "password", true]],
            "Passwort speichern",
            async (o) => {
              try {
                await api("/api/auth/password-reset/confirm", {
                  token,
                  password: o.password,
                });
                screen(
                  "Dein Passwort ist geändert.",
                  "Du kannst dich jetzt mit deinem neuen Passwort anmelden.",
                );
                link("Zur Anmeldung", "/account/login");
              } catch (e) {
                if (e.status === 400 && !host.querySelector("a"))
                  link("Neuen Link anfordern", "/account/reset");
                throw e;
              }
            },
          );
        } else {
          screen(
            "Passwort vergessen? Das kriegen wir hin.",
            "Fordere einen Link an, um ein neues Passwort festzulegen.",
          );
          form(
            [["email", "E-Mail-Adresse", "email", true]],
            "Link anfordern",
            async (o) => {
              const j = await api("/api/auth/password-reset/request", o);
              screen("Prüfe dein E-Mail-Postfach.", j.message);
              info.append(node("span", o.email, "email"));
              notice(
                "Der Link ist 30 Minuten gültig. Nutze den neuesten Link, wenn du mehrere angefordert hast.",
              );
              link("Zur Anmeldung", "/account/login");
              link("Andere E-Mail-Adresse eingeben", "/account/reset");
            },
          );
          link("Zurück zur Anmeldung", "/account/login");
        }
      } else if (mode === "mfa") {
        const recovery = document.createElement("a");
        recovery.href = "/account/recovery";
        recovery.textContent = "Notfallcode verwenden";
        host.append(recovery);
        title.textContent = "Zwei-Faktor-Authentifizierung";
        info.textContent =
          "Nutze eine Authenticator-App. Falls du noch keinen Code eingerichtet hast, wähle „Einrichten“.";
        const setup = document.createElement("button");
        setup.textContent = "Authenticator einrichten";
        host.append(setup);
        setup.onclick = async () => {
          try {
            const j = await api("/api/auth/totp/setup", {});
            message("Schlüssel in der Authenticator-App eingeben: " + j.secret);
          } catch (e) {
            message(e.message, true);
          }
        };
        form(
          [["code", "6-stelliger Code", "text", true]],
          "Code bestätigen",
          async (o) => {
            try {
              const j = await api("/api/auth/totp/verify", o);
              route(j.next);
            } catch (e) {
              const j = await api("/api/auth/totp/confirm", o);
              if (j.recovery_codes) {
                const p = document.createElement("pre");
                p.className = "codes";
                p.textContent = j.recovery_codes.join("\n");
                host.append(p);
                message(
                  "Notfallcodes sicher speichern. Du kannst dich danach anmelden.",
                );
              } else route(j.next);
            }
          },
        );
      } else if (mode === "recovery") {
        title.textContent = "Notfallcode verwenden";
        form(
          [["code", "Einmaliger Notfallcode", "text", true]],
          "Anmelden",
          async (o) => {
            const j = await api("/api/auth/totp/recover", o);
            route(j.next);
          },
        );
      } else if (mode === "admin") {
        title.textContent = "Benutzerverwaltung";
        info.textContent = "Nur für Administratoren.";
        api("/api/admin/users", null, "GET")
          .then(({ users }) => {
            users.forEach((u) => {
              const d = document.createElement("div");
              d.className = "user";
              const p = document.createElement("p");
              p.textContent =
                u.first_name +
                " " +
                (u.last_name || "") +
                " · " +
                u.email +
                " · " +
                u.status;
              d.append(p);
              for (const [label, act] of [
                ["Freischalten", "activate"],
                ["Sperren", "block"],
                ["Entsperren", "unblock"],
              ]) {
                const b = document.createElement("button");
                b.textContent = label;
                b.onclick = async () => {
                  try {
                    await api("/api/admin/users/" + u.id + "/" + act, {});
                    message("Aktion durchgeführt");
                    location.reload();
                  } catch (e) {
                    message(e.message, true);
                  }
                };
                d.append(b);
              }
              host.append(d);
            });
          })
          .catch((e) => message(e.message, true));
      } else {
        message("Seite nicht gefunden", true);
      }
      if (mode === "mfa" || mode === "recovery") navigation(true);
    </script>
  </body>
</html>
